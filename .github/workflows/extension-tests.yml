name: Synthetic MV3 extension tests

on:
  pull_request:
    branches: ['claude/repository-review-cmv02q']
  push:
    branches: ['test/**', 'claude/repository-review-cmv02q']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesh-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install pinned test-only packages without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Runtime immutability and characterization tests
        run: npm test
      - name: Install official bundled Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run real MV3 tests on synthetic fixtures only
        run: npm run test:e2e
      - name: Preserve test evidence including first failure screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: synthetic-mesh-test-reports
          path: tests/artifacts/
          if-no-files-found: warn
          retention-days: 7
